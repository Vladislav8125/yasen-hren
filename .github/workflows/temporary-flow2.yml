name: Temporary flow2 deployment
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.YASEN_TEMP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H 188.225.25.68 >> ~/.ssh/known_hosts
      - name: Upload update
        run: scp -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 yasen-flow2.tgz root@188.225.25.68:/root/yasen-flow2.tgz
      - name: Build and switch isolated release
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 root@188.225.25.68 '
            set -eu
            current=/opt/yasen-hren-release-20261110-checkout-ssr
            release=/opt/yasen-hren-release-20261110-flow2
            backup=/root/yasen-backups/20261110-before-flow2.service.conf
            test -d "$current"
            test ! -e "$release"
            mkdir -p "$release"
            rsync -a --exclude=.git --exclude=node_modules --exclude=.next "$current/" "$release/"
            tar -xzf /root/yasen-flow2.tgz -C "$release"
            cd "$release"
            npm ci --ignore-scripts
            npx prisma generate
            npx next build --webpack
            cp /etc/systemd/system/yasen-hren.service.d/30-next-release.conf "$backup"
            printf "[Service]\nWorkingDirectory=%s\nExecStart=\nExecStart=/usr/bin/npm start\n" "$release" > /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
            systemctl daemon-reload
            systemctl restart yasen-hren.service
            sleep 8
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 http://127.0.0.1:3000/)
            deck=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 http://127.0.0.1:3000/deck)
            printf "HOME:%s DECK:%s\n" "$home" "$deck"
            if ! systemctl is-active --quiet yasen-hren.service || [ "$home" != "200" ] || [ "$deck" != "200" ]; then
              cp "$backup" /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
              systemctl daemon-reload
              systemctl restart yasen-hren.service
              echo "Health check failed; rolled back" >&2
              exit 1
            fi
            rm -f /root/yasen-flow2.tgz
            echo DEPLOY_OK
          '
