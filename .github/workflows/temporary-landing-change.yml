name: Temporary landing change

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.YASEN_TEMP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H 188.225.25.68 >> ~/.ssh/known_hosts
      - name: Upload change
        run: scp yasen-landing-change.tgz root@188.225.25.68:/root/yasen-landing-change.tgz
      - name: Build and switch isolated release
        run: |
          ssh root@188.225.25.68 '
            set -eu
            current=/opt/yasen-hren-release-20261109-landing-copy
            release=/opt/yasen-hren-release-20261110-deck-checkout
            test -d "$current"
            test ! -e "$release"
            mkdir -p "$release"
            rsync -a --exclude=.git --exclude=node_modules --exclude=.next "$current/" "$release/"
            tar -xzf /root/yasen-landing-change.tgz -C "$release"
            rm -f "$release/src/app/landing/page.tsx"
            cd "$release"
            npm ci --ignore-scripts
            npx prisma generate
            npx next build --webpack
            cp /etc/systemd/system/yasen-hren.service.d/30-next-release.conf /root/yasen-backups/20261109-pre-platform-split/30-next-release.before-deck-checkout.conf
            printf "[Service]\nWorkingDirectory=%s\nExecStart=\nExecStart=/usr/bin/npm start\n" "$release" > /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
            systemctl daemon-reload
            systemctl restart yasen-hren.service
            sleep 8
            if ! systemctl is-active --quiet yasen-hren.service || ! curl -fsS --max-time 20 http://127.0.0.1:3000/deck >/dev/null || [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/landing)" != "308" ]; then
              cp /root/yasen-backups/20261109-pre-platform-split/30-next-release.before-deck-checkout.conf /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
              systemctl daemon-reload
              systemctl restart yasen-hren.service
              exit 1
            fi
            rm -f /root/yasen-landing-change.tgz
            echo DEPLOY_OK
          '
