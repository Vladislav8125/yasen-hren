name: Temporary Yasen cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.YASEN_TEMP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H 188.225.25.68 >> ~/.ssh/known_hosts
      - name: Remove temporary transfer files
        run: |
          ssh root@188.225.25.68 '
            set -eu
            test "$(systemctl show yasen-hren.service -p WorkingDirectory --value)" = "/opt/yasen-hren-release-20261109-platforms"
            rm -f /root/yasen-platform-release.tgz
            rm -f /opt/yasen-hren-release/scripts/temporary-database-backup.mjs
            systemctl is-active --quiet yasen-hren.service
            curl -fsS --max-time 20 http://127.0.0.1:3000/deck >/dev/null
            echo CLEANUP_OK
          '
