name: Temporary Yasen deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.YASEN_TEMP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H 188.225.25.68 >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
      - name: Upload release patch
        run: scp yasen-platform-release.tgz root@188.225.25.68:/root/yasen-platform-release.tgz
      - name: Build, migrate and switch release
        run: |
          ssh -o ConnectTimeout=30 root@188.225.25.68 '
            set -eu
            live=/opt/yasen-hren-release
            release=/opt/yasen-hren-release-20261109-platforms
            backup=/root/yasen-backups/20261109-pre-platform-split
            test -d "$live"
            test -f "$live/.env"
            test ! -e "$release"
            mkdir -p "$release" "$backup"
            rsync -a --exclude=.git --exclude=node_modules --exclude=.next "$live/" "$release/"
            tar -xzf /root/yasen-platform-release.tgz -C "$release"
            cd "$release"
            npm ci --ignore-scripts
            npx prisma generate
            npx next build --webpack
            if ! command -v pg_dump >/dev/null; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
            fi
            set -a
            . ./.env
            set +a
            pg_dump "$DATABASE_URL" --format=custom --file="$backup/database-before-platforms.dump"
            test -s "$backup/database-before-platforms.dump"
            cp /etc/systemd/system/yasen-hren.service.d/30-next-release.conf "$backup/30-next-release.before-platforms.conf"
            npx prisma migrate deploy
            printf "[Service]\nWorkingDirectory=%s\nExecStart=\nExecStart=/usr/bin/npm start\n" "$release" > /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
            systemctl daemon-reload
            systemctl restart yasen-hren.service
            sleep 8
            if ! systemctl is-active --quiet yasen-hren.service || ! curl -fsS --max-time 20 http://127.0.0.1:3000/ >/dev/null; then
              cp "$backup/30-next-release.before-platforms.conf" /etc/systemd/system/yasen-hren.service.d/30-next-release.conf
              systemctl daemon-reload
              systemctl restart yasen-hren.service
              echo "Health check failed; application rolled back" >&2
              exit 1
            fi
            echo "DEPLOY_OK"
          '
