<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
 <g opacity="0.1">
  <!-- вьющаяся ветвь, одна на весь тайл -->
  <path d="M -20 60 C 60 20, 120 100, 200 60 S 340 20, 440 70"
        fill="none" stroke="#b8892e" stroke-width="1.6" stroke-linecap="round" />

  <!-- листья -->
  <g fill="#5b7b4f">
    <ellipse cx="90" cy="46" rx="8" ry="3.6" transform="rotate(-30 90 46)" />
    <ellipse cx="300" cy="50" rx="8" ry="3.6" transform="rotate(25 300 50)" />
  </g>

  <!-- ягодная гроздь (рябина) -->
  <g fill="#7a1620">
    <circle cx="150" cy="40" r="3.4" />
    <circle cx="157" cy="35" r="3.4" />
    <circle cx="156" cy="46" r="3.4" />
  </g>

  <!-- шестерёнка (стимпанк-акцент) -->
  <g transform="translate(340 260)" fill="none" stroke="#b8892e" stroke-width="1.3">
    <circle r="8" />
    <circle r="2.2" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -10 L0 -13.5" />
      <path d="M0 10 L0 13.5" />
      <path d="M-10 0 L-13.5 0" />
      <path d="M10 0 L13.5 0" />
      <path d="M-7 -7 L-9.5 -9.5" />
      <path d="M7 7 L9.5 9.5" />
      <path d="M-7 7 L-9.5 9.5" />
      <path d="M7 -7 L9.5 -9.5" />
    </g>
  </g>

  <!-- вторая ветвь, ниже, смещена — разбивает регулярность тайла -->
  <path d="M -20 320 C 60 290, 100 350, 180 320 S 300 290, 440 330"
        fill="none" stroke="#b8892e" stroke-width="1.6" stroke-linecap="round" />
  <g fill="#5b7b4f">
    <ellipse cx="70" cy="308" rx="8" ry="3.6" transform="rotate(20 70 308)" />
  </g>
  <g fill="#7a1620">
    <circle cx="230" cy="316" r="3.4" />
    <circle cx="237" cy="311" r="3.4" />
    <circle cx="236" cy="322" r="3.4" />
  </g>

  <g transform="translate(60 180)" fill="none" stroke="#b8892e" stroke-width="1.1">
    <circle r="5.5" />
    <circle r="1.6" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -7.5 L0 -9.8" />
      <path d="M0 7.5 L0 9.8" />
      <path d="M-7.5 0 L-9.8 0" />
      <path d="M7.5 0 L9.8 0" />
    </g>
  </g>
 </g>
</svg>
