<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
 <g opacity="0.22">

  <!-- ягодно-растительная ветвь (рябина), верх тайла -->
  <path d="M -20 55 C 60 15, 120 95, 200 55 S 340 15, 500 65"
        fill="none" stroke="#b8892e" stroke-width="1.6" stroke-linecap="round" />
  <g fill="#5b7b4f">
    <ellipse cx="86" cy="42" rx="8" ry="3.6" transform="rotate(-30 86 42)" />
    <ellipse cx="100" cy="36" rx="7" ry="3.2" transform="rotate(-10 100 36)" />
    <ellipse cx="330" cy="46" rx="8" ry="3.6" transform="rotate(25 330 46)" />
  </g>
  <g fill="#7a1620">
    <circle cx="150" cy="36" r="3.6" /><circle cx="158" cy="31" r="3.6" /><circle cx="157" cy="43" r="3.6" />
    <circle cx="163" cy="37" r="3.2" />
  </g>

  <!-- инженерная "схема" — круговая диаграмма с делениями, как СХЕМА ЧЁЙТО на карте -->
  <g transform="translate(400 130)" fill="none" stroke="#b8892e" stroke-width="1">
    <circle r="26" stroke-dasharray="2 3" />
    <circle r="17" />
    <circle r="3" fill="#b8892e" stroke="none" />
    <path d="M0 -26 L0 -17 M0 17 L0 26 M-26 0 L-17 0 M17 0 L26 0" />
    <path d="M-18.4 -18.4 L-12 -12 M12 12 L18.4 18.4 M-18.4 18.4 L-12 12 M12 -12 L18.4 -18.4" />
  </g>

  <!-- печатная плата — контурные дорожки с узлами (технический чертёж) -->
  <g fill="none" stroke="#b8892e" stroke-width="1" opacity="0.9">
    <path d="M30 150 L30 190 L70 190 L70 220 L120 220" />
    <path d="M120 220 L120 250" />
    <circle cx="30" cy="150" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="70" cy="190" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="120" cy="220" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="120" cy="250" r="2.6" fill="#b8892e" stroke="none" />
  </g>

  <!-- 2 шестерёнки разного размера — стимпанк-акцент -->
  <g transform="translate(430 300)" fill="none" stroke="#b8892e" stroke-width="1.3">
    <circle r="9" /><circle r="2.4" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -11 L0 -15" /><path d="M0 11 L0 15" /><path d="M-11 0 L-15 0" /><path d="M11 0 L15 0" />
      <path d="M-7.8 -7.8 L-10.6 -10.6" /><path d="M7.8 7.8 L10.6 10.6" />
      <path d="M-7.8 7.8 L-10.6 10.6" /><path d="M7.8 -7.8 L10.6 -10.6" />
    </g>
  </g>
  <g transform="translate(200 300)" fill="none" stroke="#b8892e" stroke-width="1.1">
    <circle r="6" /><circle r="1.8" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -8 L0 -10.5" /><path d="M0 8 L0 10.5" /><path d="M-8 0 L-10.5 0" /><path d="M8 0 L10.5 0" />
    </g>
  </g>

  <!-- вторая ветвь, низ тайла, смещена по фазе -->
  <path d="M -20 400 C 60 365, 110 430, 190 400 S 300 365, 500 410"
        fill="none" stroke="#b8892e" stroke-width="1.6" stroke-linecap="round" />
  <g fill="#5b7b4f">
    <ellipse cx="60" cy="386" rx="8" ry="3.6" transform="rotate(20 60 386)" />
    <ellipse cx="350" cy="392" rx="7" ry="3.2" transform="rotate(-20 350 392)" />
  </g>
  <g fill="#7a1620">
    <circle cx="250" cy="393" r="3.6" /><circle cx="258" cy="388" r="3.6" /><circle cx="257" cy="400" r="3.6" />
  </g>

  <!-- ещё один короткий контур платы, ниже -->
  <g fill="none" stroke="#b8892e" stroke-width="1" opacity="0.9">
    <path d="M380 60 L410 60 L410 95" />
    <circle cx="380" cy="60" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="410" cy="95" r="2.6" fill="#b8892e" stroke="none" />
  </g>

  <!-- заполнение среднего пояса тайла — гуще, меньше пустоты -->
  <g fill="none" stroke="#b8892e" stroke-width="1" opacity="0.9">
    <path d="M230 140 L230 175 L270 175" />
    <circle cx="230" cy="140" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="270" cy="175" r="2.6" fill="#b8892e" stroke="none" />
  </g>
  <g transform="translate(60 240)" fill="none" stroke="#b8892e" stroke-width="1.1">
    <circle r="6.5" /><circle r="1.8" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -8.5 L0 -11" /><path d="M0 8.5 L0 11" /><path d="M-8.5 0 L-11 0" /><path d="M8.5 0 L11 0" />
    </g>
  </g>
  <g fill="#5b7b4f">
    <ellipse cx="330" cy="230" rx="7" ry="3.2" transform="rotate(15 330 230)" />
  </g>
  <g fill="#7a1620">
    <circle cx="380" cy="240" r="3.2" /><circle cx="387" cy="236" r="3.2" /><circle cx="386" cy="247" r="3.2" />
  </g>
  <g transform="translate(300 340)" fill="none" stroke="#b8892e" stroke-width="1">
    <circle r="20" stroke-dasharray="2 3" />
    <circle r="2.4" fill="#b8892e" stroke="none" />
    <path d="M0 -20 L0 -13 M0 13 L0 20 M-20 0 L-13 0 M13 0 L20 0" />
  </g>
  <g fill="none" stroke="#b8892e" stroke-width="1" opacity="0.9">
    <path d="M120 330 L150 330 L150 360" />
    <circle cx="120" cy="330" r="2.6" fill="#b8892e" stroke="none" />
    <circle cx="150" cy="360" r="2.6" fill="#b8892e" stroke="none" />
  </g>
 </g>
</svg>
