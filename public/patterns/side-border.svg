<svg xmlns="http://www.w3.org/2000/svg" width="64" height="300" viewBox="0 0 64 300">
  <!-- вертикальная рамка по образцу боковин физических карт: двойная золотая
       линия, узлы-шестерёнки через равный шаг, ягодная гроздь раз в тайл. -->

  <!-- двойная рамочная линия -->
  <g fill="none" stroke="#b8892e" stroke-width="1.4" opacity="0.55">
    <line x1="14" y1="0" x2="14" y2="300" />
    <line x1="20" y1="0" x2="20" y2="300" />
  </g>

  <!-- вьющийся стебель между линиями -->
  <path d="M17 0 C 26 20, 8 40, 17 60 S 26 100, 17 120 S 8 160, 17 180 S 26 220, 17 240 S 8 280, 17 300"
        fill="none" stroke="#b8892e" stroke-width="1.2" opacity="0.5" />

  <!-- шестерёнки-узлы -->
  <g transform="translate(17 30)" fill="none" stroke="#b8892e" stroke-width="1.2" opacity="0.7">
    <circle r="6.5" /><circle r="1.8" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -8.5 L0 -11" /><path d="M0 8.5 L0 11" /><path d="M-8.5 0 L-11 0" /><path d="M8.5 0 L11 0" />
    </g>
  </g>
  <g transform="translate(17 210)" fill="none" stroke="#b8892e" stroke-width="1.2" opacity="0.7">
    <circle r="6.5" /><circle r="1.8" fill="#b8892e" stroke="none" />
    <g stroke-linecap="round">
      <path d="M0 -8.5 L0 -11" /><path d="M0 8.5 L0 11" /><path d="M-8.5 0 L-11 0" /><path d="M8.5 0 L11 0" />
    </g>
  </g>

  <!-- ягодная гроздь + листья, раз в тайл -->
  <g fill="#5b7b4f" opacity="0.7">
    <ellipse cx="30" cy="118" rx="7" ry="3.2" transform="rotate(60 30 118)" />
    <ellipse cx="6" cy="126" rx="7" ry="3.2" transform="rotate(-60 6 126)" />
  </g>
  <g fill="#7a1620" opacity="0.7">
    <circle cx="17" cy="140" r="3.4" /><circle cx="23" cy="145" r="3.4" /><circle cx="11" cy="145" r="3.4" />
  </g>

  <!-- тонкая красная перфорированная кромка у самого края (как на карте) -->
  <g fill="#7a1620" opacity="0.35">
    <circle cx="2" cy="6" r="1.3" /><circle cx="2" cy="18" r="1.3" /><circle cx="2" cy="30" r="1.3" />
    <circle cx="2" cy="42" r="1.3" /><circle cx="2" cy="54" r="1.3" /><circle cx="2" cy="66" r="1.3" />
    <circle cx="2" cy="78" r="1.3" /><circle cx="2" cy="90" r="1.3" /><circle cx="2" cy="102" r="1.3" />
    <circle cx="2" cy="114" r="1.3" /><circle cx="2" cy="126" r="1.3" /><circle cx="2" cy="138" r="1.3" />
    <circle cx="2" cy="150" r="1.3" /><circle cx="2" cy="162" r="1.3" /><circle cx="2" cy="174" r="1.3" />
    <circle cx="2" cy="186" r="1.3" /><circle cx="2" cy="198" r="1.3" /><circle cx="2" cy="210" r="1.3" />
    <circle cx="2" cy="222" r="1.3" /><circle cx="2" cy="234" r="1.3" /><circle cx="2" cy="246" r="1.3" />
    <circle cx="2" cy="258" r="1.3" /><circle cx="2" cy="270" r="1.3" /><circle cx="2" cy="282" r="1.3" />
    <circle cx="2" cy="294" r="1.3" />
  </g>
</svg>
